name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:      # 允许在 GitHub 网页手动触发
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build AI朋友圈 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Grant build cache
        run: mkdir -p $HOME/.gradle

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK (作为 CI 产物)
        uses: actions/upload-artifact@v4
        with:
          name: ai-moments-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (仅在打 tag 或手动触发时)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          name: AI朋友圈 ${{ github.ref_name }}
          body: |
            自动构建的 AI 朋友圈 APK(dbg 版,可直接安装)。
            使用方式见本项目 README.md。
