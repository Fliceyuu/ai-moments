plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moments.ai'
    compileSdk 34

    signingConfigs {
        // 固定签名：使用仓库内置 debug.keystore（alias=aikey, 密码=android）
        // 保证每次 CI 构建签名一致，从而可直接覆盖安装/更新，不再出现"签名不一致"
        debug {
            storeFile file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'aikey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.moments.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 纯 WebView 应用,无需额外依赖;仅使用框架内置类
}
