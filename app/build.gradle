plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moments.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.moments.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 纯 WebView 应用,无需额外依赖;仅使用框架内置类
}
